# K2: every pull request (and every push to main) is checked the way a part is checked before it
# merges: types, tests, the web build, and the first-load budgets. Everything runs against the mock
# provider; nothing here reaches NanoGPT or the network beyond installing packages.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Types
        run: bun run check

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Budgets
        run: bun run budgets
