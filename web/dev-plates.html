<!doctype html>
<!--
  Contact sheet for the scene art (docs/24-rooms-of-the-house.md §4). Dev server only: open
  /dev-plates.html. It isn't a build input, so it never reaches web/dist, and it needs no API.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scene contact sheet</title>
    <style>
      body { margin: 0; padding: 16px; background: #14121c; color: #e8e4f0; font: 13px system-ui, sans-serif; }
      form { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 0 12px; background: #14121c; }
      output { margin-left: auto; color: #a9a3b8; }
      h2 { margin: 20px 0 8px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #a9a3b8; }
      .grid { display: flex; flex-wrap: wrap; gap: 12px; }
      figure { margin: 0; }
      canvas { display: block; max-width: 100%; border-radius: 10px; background: #0a0c20; }
      figcaption { padding-top: 4px; color: #a9a3b8; }
    </style>
  </head>
  <body>
    <form id="controls">
      <label>Shape <select name="shape"><option value="plate">Plate</option><option value="strip">Strip</option><option value="tile">Picker tile</option></select></label>
      <label>Hour <select name="hour"><option value="12">Noon</option><option value="18.5">Dusk</option><option value="0">Midnight</option></select></label>
      <label>Weather <select name="weather"><option value="clear">Clear</option><option value="rain">Rain</option><option value="snow">Snow</option><option value="storm">Storm</option><option value="fog">Fog</option></select></label>
      <label>House <select name="style"><option value="">None</option><option>modern</option><option>humble</option><option>grand</option><option>old</option></select></label>
      <label>Name <input name="house" value="jackie's house" size="14" /></label>
      <label>Masonry <select name="masonry"><option value="">None</option><option value="ashlar">Pale stone</option><option value="redstone">Red stone</option><option value="fused">Melted black</option></select></label>
      <label>Group <select name="group"><option value="">All</option></select></label>
      <output id="timing"></output>
    </form>
    <main id="sheet"></main>
    <script type="module">
      import { PLACE_GROUPS, ScenePainter } from "/src/lib/scenery.ts";

      const SHAPES = {
        plate: { w: 576, h: 144, focus: 0.72, mini: true },
        strip: { w: 800, h: 176, focus: 0.72, mini: false },
        tile: { w: 240, h: 150, focus: 0.55, mini: true },
      };
      const form = document.querySelector("#controls");
      for (const g of PLACE_GROUPS) form.group.add(new Option(g.label, g.label));

      function render() {
        const { w, h, focus, mini } = SHAPES[form.shape.value];
        const sheet = document.querySelector("#sheet");
        sheet.replaceChildren();
        const times = [];
        for (const g of PLACE_GROUPS) {
          if (form.group.value && form.group.value !== g.label) continue;
          const head = document.createElement("h2");
          head.textContent = g.label;
          const grid = document.createElement("div");
          grid.className = "grid";
          sheet.append(head, grid);
          for (const k of g.kinds) {
            const fig = document.createElement("figure");
            const c = document.createElement("canvas");
            c.style.width = `${w}px`;
            c.style.height = `${h}px`;
            const cap = document.createElement("figcaption");
            cap.textContent = `${k.label} (${k.id})`;
            const masonry = form.masonry.value;
            const home = masonry ? { house: "the keep", style: "old", keep: { masonry } } : form.style.value ? { house: form.house.value, style: form.style.value } : null;
            fig.append(c, cap);
            grid.append(fig);
            const t0 = performance.now();
            ScenePainter.paintOnce(c, { hour: Number(form.hour.value), weather: form.weather.value, place: k.id, seed: "the kitchen", home, focus, mini });
            times.push(performance.now() - t0);
            // docs/25 §6: a castle's room stays readable at midnight. Flag a left half close to black.
            if (masonry) {
              const px = c.getContext("2d").getImageData(0, 0, c.width >> 1, c.height).data;
              let sum = 0;
              for (let i = 0; i < px.length; i += 64) sum += 0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2];
              const mean = sum / (px.length / 64);
              cap.textContent += ` · left ${mean.toFixed(0)}`;
              if (mean < 22) cap.style.color = "#ff8a7a";
            }
          }
        }
        times.sort((a, b) => a - b);
        const at = (q) => times[Math.floor((times.length - 1) * q)].toFixed(1);
        document.querySelector("#timing").textContent = `${times.length} paints · median ${at(0.5)} ms · worst ${at(1)} ms · total ${times.reduce((a, b) => a + b, 0).toFixed(0)} ms`;
      }
      form.addEventListener("change", render);
      render();
    </script>
  </body>
</html>
