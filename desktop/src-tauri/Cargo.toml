[package]
name = "mea-desktop"
version = "0.1.0"
description = "Mea for Windows: a window and tray icon for the Mea that runs on this computer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
ureq = { version = "2", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
